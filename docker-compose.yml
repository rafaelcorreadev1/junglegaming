# Shared by every app replica.
x-app: &app
  build: .
  image: wagering-service:local
  environment:
    HTTP_ADDR: ":8080"
    DATABASE_URL: postgres://${POSTGRES_USER:-wagering}:${POSTGRES_PASSWORD:-wagering}@postgres:5432/${POSTGRES_DB:-wagering}?sslmode=disable
    LOG_LEVEL: ${LOG_LEVEL:-info}
    SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20s}
    REFERENCE_POLL_INTERVAL: ${REFERENCE_POLL_INTERVAL:-1s}
    REFERENCE_RETRY_BASE_DELAY: ${REFERENCE_RETRY_BASE_DELAY:-1s}
    REFERENCE_RETRY_MAX_DELAY: ${REFERENCE_RETRY_MAX_DELAY:-1m}
    REFERENCE_MAX_ATTEMPTS: ${REFERENCE_MAX_ATTEMPTS:-10}
    REFERENCE_LEASE: ${REFERENCE_LEASE:-30s}
    AUTH_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/wagering
    AUTH_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
    AUTH_AUDIENCE: wagering-service
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    SQS_ENDPOINT: http://localstack:4566
    OUTBOX_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
    OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-500ms}
    OUTBOX_LEASE: ${OUTBOX_LEASE:-30s}
    WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
    WAGER_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
    WAGER_QUEUE_PROVIDERS: ${WAGER_QUEUE_PROVIDERS:-provider-a,provider-b}
    WAGER_VISIBILITY_TIMEOUT: ${WAGER_VISIBILITY_TIMEOUT:-30s}
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    keycloak:
      condition: service_healthy
    localstack:
      condition: service_healthy
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wagering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagering}
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-wagering}:${POSTGRES_PASSWORD:-wagering}@postgres:5432/${POSTGRES_DB:-wagering}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Fixes the token issuer to the URL callers on the host use, even when the app fetches keys through the Docker network.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl; bash /dev/tcp is enough to ask the management port for readiness.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  localstack:
    image: localstack/localstack:4.9
    environment:
      SERVICES: sqs
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./deploy/localstack:/etc/localstack/init/ready.d:ro
    healthcheck:
      # Healthy only after the init script created the queues, not just when LocalStack answers.
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-events.fifo >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  app:
    <<: *app
    ports:
      - "${APP_PORT:-8080}:8080"

  # Two more replicas for the multi-instance tests: docker compose --profile multi up -d
  app-2:
    <<: *app
    profiles: [multi]
    ports:
      - "${APP_2_PORT:-8082}:8080"

  app-3:
    <<: *app
    profiles: [multi]
    ports:
      - "${APP_3_PORT:-8083}:8080"

volumes:
  postgres-data:
